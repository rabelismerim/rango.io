services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: rango
      POSTGRES_USER: rango
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rango-local-only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
volumes:
  postgres_data:
